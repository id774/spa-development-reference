# frontend/nginx/default.conf: nginx server configuration of the frontend container
#
# Description:
# Serves the built SPA on port 8080. It provides the /healthz endpoint used by
# the load balancer target group, long-lived caching for content-hashed
# assets, no caching of the runtime configuration, and the SPA fallback to
# index.html, which is never long-cached. The browser security headers are
# included from security-headers.conf in every location.
#
# Author: id774 (More info: https://id774.net)
# Source Code: https://github.com/id774/spa-reference
# License: The GPL version 3, or LGPL version 3 (Dual License).
# Contact: idnanashi@gmail.com
#
# Requirements:
# - nginx (nginxinc/nginx-unprivileged image)

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/security-headers.conf;

  # Target group health check.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Content-hashed assets can be cached aggressively.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Runtime configuration changes between deployments.
  location = /config.json {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # SPA fallback: unknown non-asset paths return index.html, which is never long-cached.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
