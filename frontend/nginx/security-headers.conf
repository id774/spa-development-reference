# frontend/nginx/security-headers.conf: browser security response headers
#
# Description:
# Defines the security headers added to every response of the frontend
# container: content type sniffing protection, referrer policy, framing
# denial, and the Content-Security-Policy. The policy is defined only here and
# is not duplicated in other files.
#
# Author: id774 (More info: https://id774.net)
# Source Code: https://github.com/id774/spa-development-reference
# License: The GPL version 3, or LGPL version 3 (Dual License).
# Contact: idnanashi@gmail.com
#
# Requirements:
# - nginx (nginxinc/nginx-unprivileged image)

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.amazoncognito.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
