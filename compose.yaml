# compose.yaml: local demo infrastructure
#
# Description:
# Defines the PostgreSQL 17 database used by npm run demo. The port is bound
# to 127.0.0.1 only and the credentials are non-production demo values; they
# are not secrets and must never be used for a shared or production database.
#
# The fixed project name makes the data volume name predictable
# (spa-reference-demo_postgres-data), independent of the clone directory name.
#
# Author: id774 (More info: https://id774.net)
# Source Code: https://github.com/id774/spa-development-reference
# License: The GPL version 3, or LGPL version 3 (Dual License).
# Contact: idnanashi@gmail.com
#
# Usage:
#     docker compose up -d
#     docker compose down
#     Normally driven by npm run demo.
#
# Requirements:
# - Docker with Compose v2

name: spa-reference-demo

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: spa_reference
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d spa_reference']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
