# openapi/openapi.yaml: browser-facing HTTP contract
#
# Description:
# The normative OpenAPI 3.1 contract of the browser-facing HTTP API and the
# single source of truth for its paths, schemas, and errors. It defines the
# server-derived authentication and authorization contract and the evaluation
# order of failures.
#
# The header version below is the version of this file's header documentation.
# The API version is the info.version field and is independent of it.
#
# Author: id774 (More info: https://id774.net)
# Source Code: https://github.com/id774/spa-reference
# License: The GPL version 3, or LGPL version 3 (Dual License).
# Contact: idnanashi@gmail.com
#
# Requirements:
# - OpenAPI 3.1
# - Validated with Redocly CLI (npm run openapi:lint)
#
# Version History:
# v1.0 2026-10-03
#      Initial release.

openapi: 3.1.0
info:
  title: SPA Reference API
  version: 0.1.0
  description: |
    Normative browser-facing HTTP contract of the SPA development reference
    application, a generic request and approval sample.

    All business endpoints require a Bearer access token. In the AWS
    deployment (`APP_MODE=aws`) it is a JWT access token issued by Amazon
    Cognito and the application role of the caller (Requester, Approver, or
    Administrator) is derived from the `cognito:groups` claim of the validated
    token. In the local demo (`APP_MODE=local`) it is one of three fixed demo
    tokens and the backend maps each to one role. In both modes the roles are
    derived by the server, and each operation states the roles it requires.
    A caller that lacks the required role, or that is not permitted to use the
    addressed resource, receives `403 FORBIDDEN`. The Administrator role is not
    a superuser.

    Evaluation order for a business operation: authentication, coarse role,
    structural validation (path, query, content type, body), resource lookup,
    resource authorization, version, state. The first failing step determines
    the response; in particular, when a supplied `version` is stale and the
    current state is also invalid, the response is `409 CONCURRENCY_CONFLICT`.
    An unknown path is `404 ROUTE_NOT_FOUND` and an unsupported method on a known
    path is `405 METHOD_NOT_ALLOWED`; both are Problem responses. The detailed
    processing semantics are defined in `doc/DETAILED_DESIGN.md`. Expected failures use `application/problem+json` with a
    stable application `code` and a `traceId`.
servers:
  - url: /
    description: Same origin as the single-page application (paths include `/api`).
tags:
  - name: Session
  - name: Requests
  - name: Approvals
  - name: Attachments
  - name: Audit
security:
  - bearerAuth: []
paths:
  /api/session:
    get:
      operationId: getSession
      tags: [Session]
      summary: Get the current application session
      description: |
        Returns the application identity that the server derived from the
        validated bearer token, for SPA navigation and screen presentation.
        Requires a valid bearer access token and no application role. A caller
        with no recognized role receives `200` with an empty `roles` array.

        The roles are for presentation only; server-side authorization on every
        operation remains authoritative and never relies on a value sent back
        by the browser.
      responses:
        '200':
          description: The current application session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
  /api/requests:
    get:
      operationId: listRequests
      tags: [Requests]
      summary: List requests visible to the caller
      description: |
        Requester: only requests whose `requesterId` is the caller. Administrator:
        all requests. A caller with both roles sees the union. A caller with
        neither role (for example an Approver only) receives `403 FORBIDDEN`.

        Order: `updatedAt` descending, then `id` ascending. Pagination is
        applied after the visibility filter.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Requests visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
    post:
      operationId: createRequest
      tags: [Requests]
      summary: Create a request in DRAFT state
      description: |
        Requires the Requester role and a verified email address on the caller's
        identity; otherwise `403 FORBIDDEN`. The `requesterId` of the created
        request is the caller's subject. If the identity provider's UserInfo
        endpoint is unavailable the response is
        `503 IDENTITY_PROVIDER_UNAVAILABLE`. The title is trimmed before
        validation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestInput'
      responses:
        '201':
          description: The request was created in `DRAFT` state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
  /api/requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getRequest
      tags: [Requests]
      summary: Get a request
      description: |
        Requester: own request in any state. Approver: requests in `SUBMITTED`
        state only. Administrator: any request. Otherwise `403 FORBIDDEN`. A
        request that does not exist is `404`.
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
    put:
      operationId: updateDraftRequest
      tags: [Requests]
      summary: Update a draft request
      description: |
        Requires the Requester role and ownership of the request (otherwise
        `403 FORBIDDEN`). A stale `version` is `409 CONCURRENCY_CONFLICT`, and
        this takes precedence over a state error. With a matching version, only a
        request in `DRAFT` state can be updated; otherwise
        `409 REQUEST_INVALID_STATE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDraftRequestInput'
      responses:
        '200':
          description: The updated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
  /api/requests/{requestId}/submit:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: submitRequest
      tags: [Requests]
      summary: Submit a draft request
      description: |
        Transitions the request from `DRAFT` to `SUBMITTED`. Requires the
        Requester role and ownership of the request (otherwise
        `403 FORBIDDEN`). A stale `version` is `409 CONCURRENCY_CONFLICT`, and
        this takes precedence over a state error. With a matching version, a
        request not in `DRAFT` state is `409 REQUEST_INVALID_STATE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      responses:
        '200':
          description: The submitted request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
  /api/requests/{requestId}/approve:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: approveRequest
      tags: [Approvals]
      summary: Approve a submitted request
      description: |
        Transitions the request from `SUBMITTED` to `APPROVED`. Requires the
        Approver role (otherwise `403 FORBIDDEN`). A stale `version` is
        `409 CONCURRENCY_CONFLICT`, and this takes precedence over a state
        error. With a matching version, a request not in `SUBMITTED` state is
        `409 REQUEST_INVALID_STATE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionCommand'
      responses:
        '200':
          description: The approved request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
  /api/requests/{requestId}/reject:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: rejectRequest
      tags: [Approvals]
      summary: Reject a submitted request
      description: |
        Transitions the request from `SUBMITTED` to `REJECTED`. Requires the
        Approver role (otherwise `403 FORBIDDEN`). A stale `version` is
        `409 CONCURRENCY_CONFLICT`, and this takes precedence over a state
        error. With a matching version, a request not in `SUBMITTED` state is
        `409 REQUEST_INVALID_STATE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionCommand'
      responses:
        '200':
          description: The rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
  /api/approvals:
    get:
      operationId: listApprovalQueue
      tags: [Approvals]
      summary: List requests awaiting a decision
      description: |
        Requires the Approver role (otherwise `403 FORBIDDEN`). Returns requests
        in `SUBMITTED` state.

        Order: `updatedAt` ascending, then `id` ascending, so that the oldest
        submitted request comes first. Pagination is applied after the state
        filter.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Requests awaiting a decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
  /api/requests/{requestId}/attachments:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: listAttachments
      tags: [Attachments]
      summary: List the attachments of a request
      description: |
        Lists the attachment metadata of the request, so that attachment
        identifiers can be rediscovered at any time.

        Requester: attachments of an own request, in any request state.
        Approver: attachments of a request in `SUBMITTED` state. Administrator:
        attachments of any request. Otherwise `403 FORBIDDEN`; a caller with none
        of these roles receives `403` before the existence of the request is
        revealed. A request that does not exist is `404 REQUEST_NOT_FOUND`.

        Order: `createdAt` ascending, then `id` ascending. Pagination is applied
        after the authorization check. The cursor is bound to this endpoint and to
        the `requestId`; using it with another request is a
        `400 VALIDATION_ERROR`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Attachment metadata of the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
    post:
      operationId: uploadAttachment
      tags: [Attachments]
      summary: Attach a file to a request
      description: |
        Requires the Requester role and ownership of the request (otherwise
        `403 FORBIDDEN`). The request must be in `DRAFT` state; otherwise
        `409 REQUEST_INVALID_STATE`. The state is checked again when the
        attachment is finalized.

        Accepted media types: `application/pdf`, `image/png`, `image/jpeg`, and
        `text/plain`. The server validates the content against the declared
        media type, and the file name extension must match the media type.
        A mismatch or an unsupported type is `415 UNSUPPORTED_MEDIA_TYPE`.

        The default maximum size is 10 MiB and is configurable by deployment up
        to 100 MiB; a larger file is `413 PAYLOAD_TOO_LARGE`. A zero-byte file is
        rejected as `400 VALIDATION_ERROR`. File names that are empty, longer than
        255 characters, or that contain `/`, `\`, or control characters are also
        rejected as `400 VALIDATION_ERROR`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file content.
      responses:
        '201':
          description: The attachment was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/requests/{requestId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: downloadAttachment
      tags: [Attachments]
      summary: Download an attachment
      description: |
        Requester: an attachment of an own request, in any request state.
        Approver: an attachment of a request in `SUBMITTED` state.
        Administrator: any attachment. Otherwise `403 FORBIDDEN`. An attachment
        that does not belong to the `requestId` in the path is
        `404 ATTACHMENT_NOT_FOUND`.
      responses:
        '200':
          description: The attachment content, always as a download (never inline).
          headers:
            Content-Disposition:
              description: |
                `attachment` with a safe ASCII `filename` fallback and an
                RFC 8187 `filename*` carrying the stored file name.
              schema:
                type: string
            Content-Length:
              description: Stored attachment size in bytes.
              schema:
                type: integer
                minimum: 1
            X-Content-Type-Options:
              description: Always `nosniff`.
              schema:
                type: string
                enum: [nosniff]
            Cache-Control:
              description: Always `private, no-store`.
              schema:
                type: string
                enum: ['private, no-store']
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/admin/audit:
    get:
      operationId: listAuditEvents
      tags: [Audit]
      summary: List audit events
      description: |
        Requires the Administrator role (otherwise `403 FORBIDDEN`). The
        optional `requestId` filter is applied first.

        Order: `occurredAt` descending, then `id` ascending. Pagination is
        applied after the filter.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: requestId
          in: query
          required: false
          description: Restrict the result to one request.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        AWS deployment: Amazon Cognito access token only (an ID token is not
        accepted as authorization evidence). The BFF validates the token and
        derives the application roles from its `cognito:groups` claim.
        Local demo (`APP_MODE=local`): one of the fixed, non-secret demo tokens,
        which the AWS deployment never accepts. In both modes role values
        supplied by the browser are never used.
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items in the page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor taken from `nextCursor` of the previous page. Clients do
        not interpret its content. Cursors do not expire. A cursor may be bound to
        endpoint-specific filters and resource identifiers: the audit list binds
        it to the `requestId` filter, and the attachment list binds it to the
        `requestId` path value. A malformed cursor, or a cursor used with a
        different endpoint or a different bound value, is a
        `400 VALIDATION_ERROR`. Pages are not
        taken from a database snapshot: concurrent changes between page requests
        can move or skip items.
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Validation failure (`VALIDATION_ERROR`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Validation error
            status: 400
            detail: The title must be between 1 and 200 characters.
            code: VALIDATION_ERROR
            traceId: example-trace-id
    Unauthorized:
      description: Authentication is required or the token is invalid (`AUTHENTICATION_REQUIRED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Authentication required
            status: 401
            code: AUTHENTICATION_REQUIRED
            traceId: example-trace-id
    Forbidden:
      description: The caller is not permitted to perform the operation (`FORBIDDEN`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
            code: FORBIDDEN
            traceId: example-trace-id
    NotFound:
      description: The request or attachment does not exist (`REQUEST_NOT_FOUND` or `ATTACHMENT_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Request not found
            status: 404
            code: REQUEST_NOT_FOUND
            traceId: example-trace-id
    Conflict:
      description: The supplied version is stale (`CONCURRENCY_CONFLICT`, which takes precedence) or, with a matching version, the request is not in a valid state for the operation (`REQUEST_INVALID_STATE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Invalid state transition
            status: 409
            detail: The request is not in a state that can be approved.
            code: REQUEST_INVALID_STATE
            traceId: example-trace-id
    ObjectStorageUnavailable:
      description: Object storage is unavailable (`OBJECT_STORAGE_UNAVAILABLE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Object storage unavailable
            status: 503
            code: OBJECT_STORAGE_UNAVAILABLE
            traceId: example-trace-id
    PayloadTooLarge:
      description: The uploaded file exceeds the configured maximum size (`PAYLOAD_TOO_LARGE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Payload too large
            status: 413
            code: PAYLOAD_TOO_LARGE
            traceId: example-trace-id
    UnsupportedMediaType:
      description: The media type of the request body or uploaded file is not supported, or the file content or extension does not match it (`UNSUPPORTED_MEDIA_TYPE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unsupported media type
            status: 415
            code: UNSUPPORTED_MEDIA_TYPE
            traceId: example-trace-id
    IdentityProviderUnavailable:
      description: The identity provider needed to verify the token or the caller's email is unavailable (`IDENTITY_PROVIDER_UNAVAILABLE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Identity provider unavailable
            status: 503
            code: IDENTITY_PROVIDER_UNAVAILABLE
            traceId: example-trace-id
    DependencyUnavailable:
      description: |
        A required dependency is unavailable: either the identity provider
        (`IDENTITY_PROVIDER_UNAVAILABLE`) or object storage
        (`OBJECT_STORAGE_UNAVAILABLE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            identityProvider:
              value:
                title: Identity provider unavailable
                status: 503
                code: IDENTITY_PROVIDER_UNAVAILABLE
                traceId: example-trace-id
            objectStorage:
              value:
                title: Object storage unavailable
                status: 503
                code: OBJECT_STORAGE_UNAVAILABLE
                traceId: example-trace-id
    InternalError:
      description: Unexpected implementation, database, or unclassified infrastructure failure (`INTERNAL_ERROR`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Internal error
            status: 500
            code: INTERNAL_ERROR
            traceId: example-trace-id
  schemas:
    SessionRole:
      type: string
      enum:
        - Requester
        - Approver
        - Administrator
    Session:
      description: |
        The current application session. The roles are derived server-side from
        the validated Cognito access token and are for SPA presentation only;
        server authorization remains authoritative. Roles are ordered
        Requester, Approver, Administrator.
      type: object
      required: [subject, roles]
      properties:
        subject:
          type: string
          minLength: 1
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SessionRole'
        email:
          type: string
          format: email
          description: Present only when a verified email is already available. Not used for role gating.
    RequestStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]
    Request:
      type: object
      required: [id, requesterId, title, description, status, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        requesterId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 0
          maxLength: 5000
        status:
          $ref: '#/components/schemas/RequestStatus'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RequestSummary:
      description: Summary of a request. It carries the same fields as `Request`.
      allOf:
        - $ref: '#/components/schemas/Request'
    RequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestSummary'
        nextCursor:
          type: string
          minLength: 1
          description: Cursor for the next page. Omitted when there is no next page.
    CreateRequestInput:
      type: object
      required: [title, description]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 0
          maxLength: 5000
    UpdateDraftRequestInput:
      type: object
      required: [title, description, version]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 0
          maxLength: 5000
        version:
          type: integer
          minimum: 1
    VersionCommand:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
    DecisionCommand:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
        comment:
          type: string
          maxLength: 2000
    Attachment:
      type: object
      required: [id, requestId, fileName, mediaType, sizeBytes, uploadedBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        mediaType:
          type: string
          minLength: 1
          maxLength: 255
          description: One of `application/pdf`, `image/png`, `image/jpeg`, or `text/plain`.
        sizeBytes:
          type: integer
          minimum: 1
        uploadedBy:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
    AttachmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        nextCursor:
          type: string
          minLength: 1
          description: Cursor for the next page. Omitted when there is no next page.
    AuditEventType:
      description: Closed set of audit event types.
      type: string
      enum:
        - REQUEST_CREATED
        - REQUEST_UPDATED
        - REQUEST_SUBMITTED
        - REQUEST_APPROVED
        - REQUEST_REJECTED
        - ATTACHMENT_ADDED
    AuditEvent:
      description: |
        `fromState` is null for `REQUEST_CREATED`. For `ATTACHMENT_ADDED` both
        states equal the current request state and `details` contains at least
        `attachmentId`.
      type: object
      required: [id, requestId, eventType, actorId, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        eventType:
          $ref: '#/components/schemas/AuditEventType'
        actorId:
          type: string
          minLength: 1
        fromState:
          oneOf:
            - $ref: '#/components/schemas/RequestStatus'
            - type: 'null'
        toState:
          oneOf:
            - $ref: '#/components/schemas/RequestStatus'
            - type: 'null'
        details:
          type: [object, 'null']
        occurredAt:
          type: string
          format: date-time
    AuditEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          type: string
          minLength: 1
          description: Cursor for the next page. Omitted when there is no next page.
    ErrorCode:
      description: Stable machine-readable application error identifier.
      type: string
      enum:
        - VALIDATION_ERROR
        - AUTHENTICATION_REQUIRED
        - FORBIDDEN
        - REQUEST_NOT_FOUND
        - ATTACHMENT_NOT_FOUND
        - ROUTE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - REQUEST_INVALID_STATE
        - CONCURRENCY_CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - IDENTITY_PROVIDER_UNAVAILABLE
        - OBJECT_STORAGE_UNAVAILABLE
        - INTERNAL_ERROR
    Problem:
      description: |
        Problem Details (`application/problem+json`) with stable application
        extension fields. Status mapping: `VALIDATION_ERROR` 400,
        `AUTHENTICATION_REQUIRED` 401, `FORBIDDEN` 403, `REQUEST_NOT_FOUND` and
        `ATTACHMENT_NOT_FOUND` 404, `ROUTE_NOT_FOUND` 404,
        `METHOD_NOT_ALLOWED` 405, `REQUEST_INVALID_STATE` and
        `CONCURRENCY_CONFLICT` 409, `PAYLOAD_TOO_LARGE` 413,
        `UNSUPPORTED_MEDIA_TYPE` 415, `IDENTITY_PROVIDER_UNAVAILABLE` and
        `OBJECT_STORAGE_UNAVAILABLE` 503, `INTERNAL_ERROR` 500.
      type: object
      required: [title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: '#/components/schemas/ErrorCode'
        traceId:
          type: string
