# .github/workflows/ci.yml: GitHub Actions continuous integration workflow
#
# Description:
# Verifies every pull request and every push to master. The verify job uses a
# disposable PostgreSQL service and runs the standard checks: the lockfile
# install, Prisma client generation, API client freshness, format, lint, type
# check, OpenAPI validation, tests, builds, Prisma validation, migration
# validation, and CDK synth. The containers job builds both images.
#
# The workflow needs no production AWS credentials, has read-only repository
# permission, and never deploys.
#
# Author: id774 (More info: https://id774.net)
# Source Code: https://github.com/id774/spa-development-reference
# License: The GPL version 3, or LGPL version 3 (Dual License).
# Contact: idnanashi@gmail.com
#
# Requirements:
# - GitHub Actions
# - Docker (containers job)

name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The ordinary pull request path needs no AWS credentials: it uses a disposable
# PostgreSQL service and invented data, and it never deploys.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (lockfile)
        run: npm ci
      - name: Generate the Prisma client
        run: npm run prisma:generate
      - name: API client freshness
        run: npm run api:check
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: OpenAPI validation
        run: npm run openapi:lint
      - name: Automated tests
        run: npm test
      - name: Frontend build
        run: npm run build -w @spa-ref/frontend
      - name: Backend build
        run: npm run build -w @spa-ref/backend
      - name: Prisma schema validation
        run: npm run prisma:validate
      - name: Migration validation (disposable PostgreSQL)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spa_migrations
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE spa_migrations'
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: CDK synth
        run: npm run synth

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Frontend container build
        run: docker build -f frontend/Dockerfile -t spa-ref-frontend:ci .
      - name: Backend container build
        run: docker build -f backend/Dockerfile -t spa-ref-backend:ci .
